        var crs = new L.Proj.CRS('EPSG:32628', '+proj=utm +zone=28 +datum=WGS84 +units=m +no_defs', {

			controlLoader.show();

        }

            opacity: 1,
			identify: false,

        map.addLayer(layer_IDECanariasOrtoExpressCampaa2018_0);
		var controlLoader = L.control.loader().addTo(map);

		controlLoader.show();

        function pop_00_Catalogo_Bcos_Cuencas_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Cuenca</th>\
                        <td>' + (feature.properties['Cuenca'] !== null ? Autolinker.link(String(feature.properties['name'])) : '') + '</td>\
                    </tr>\
                </table>';
            layer.bindPopup(popupContent, {maxHeight: 400});
        }

        function style_00_Catalogo_Bcos_Cuencas_1_0() {
            return {
                pane: 'pane_00_Catalogo_Bcos_Cuencas_1',
                opacity: 1,
                color: 'rgba(177,56,9,1.0)',
                dashArray: '',

        map.getPane('pane_00_Catalogo_Bcos_Cuencas_1').style['mix-blend-mode'] = 'normal';
        var layer_00_Catalogo_Bcos_Cuencas_1 = new L.geoJson(json_00_Catalogo_Bcos_Cuencas_1, {

        setBounds();
        map.addControl(new L.Control.Search({

        document.getElementsByClassName('search-button')[0].className +=

	 	function zoomTo() {
			var el1 = document.forms.frm1.elements;
			var ll = L.latLng(el1.x.value, el1.y.value);

			var utm = "+proj=utm +zone=28";
			var wgs84 = "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs";
			var Xi = parseInt(document.getElementById("x").value);
			var Yi = parseInt(document.getElementById("y").value);
			var LonLat = proj4(utm, wgs84, [Xi, Yi]); 
		map.flyTo(new L.LatLng(LonLat[1],LonLat[0]), 18);
		};
