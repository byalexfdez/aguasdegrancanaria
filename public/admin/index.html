<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gestor de contenidos · Consejo Insular de Aguas de Gran Canaria</title>
  <link rel="icon" href="/favicon.gif" />
</head>
<body>
  <!-- Decap CMS (antes Netlify CMS): edita los contenidos del repositorio Git. Ver README > «Gestor de contenidos». -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    // El inicio de sesión con GitHub lo hace admin/oauth/*.php en el mismo dominio en que esté publicada la web.
    // El resto de la configuración se lee de config.yml.
    CMS.init({ config: { backend: { base_url: window.location.origin, auth_endpoint: 'admin/oauth/auth.php' } } });
  </script>
</body>
</html>
